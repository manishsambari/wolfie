<div class="confirmation-container">
  <div class="questionnaire-card">
    <div class="dragon-decor">🐉</div>

    <!-- Step Indicator Dots (5 questions: 0-4) -->
    <div class="progress-bar-container">
      <div class="progress-dots">
        @for (step of [0, 1, 2, 3, 4]; track step) {
          <span class="dot" [class.active]="step === currentStep()" [class.completed]="step < currentStep()"></span>
        }
      </div>
      <span class="step-text">
        Question {{ currentStep() + 1 }} of 5
      </span>
    </div>

    <!-- Active Question Card -->
    <div class="questions-slider">
      <div class="question-card active-card">
        <div class="question-header">
          <span class="q-emoji">{{ questions[currentStep()].emoji }}</span>
          <h2 class="q-text">{{ questions[currentStep()].text }}</h2>
        </div>
        
        <div class="textarea-container">
          <textarea
            [id]="'q-input-' + currentStep()"
            [placeholder]="'Type your thoughts here...'"
            class="conf-textarea-input"
            rows="4"
            [(ngModel)]="questions[currentStep()].answer"
          ></textarea>
          <span class="textarea-corner-heart">♡</span>
        </div>

        <div class="navigation-controls">
          @if (currentStep() > 0) {
            <button class="nav-btn prev-btn" (click)="prevStep()">
              ⬅️ Back
            </button>
          } @else {
            <div class="spacer-div"></div>
          }
          
          <button 
            class="nav-btn next-btn" 
            (click)="nextStep()"
          >
            @if (currentStep() === 4) {
              Leave a Note 💌➡️
            } @else {
              Next ➡️
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
