<div class="note-mobile-container">
  
  <!-- Header -->
  <div class="note-page-header">
    <div class="dragon-accent">🐉</div>
    <h2 class="note-page-title">Secret Notes</h2>
    <p class="note-page-subtitle">A little place for my thoughts to you 💌</p>

    <!-- Prominent Segmented Note Switcher -->
    <div class="note-segmented-tabs">
      <button 
        type="button"
        class="segment-btn"
        [class.active]="activeCard() === 'today'"
        (click)="showTodayNote()"
      >
        <span class="tab-dot"></span>
        <span>Today's Note 💌</span>
      </button>

      <button 
        type="button"
        class="segment-btn"
        [class.active]="activeCard() === 'previous'"
        (click)="showPreviousNote()"
      >
        <span class="prev-icon">📜</span>
        <span>Previous Note</span>
      </button>
    </div>
  </div>

  <!-- Note Card Display Area -->
  <div class="note-display-card">
    
    @if (activeCard() === 'today') {
      <!-- TODAY'S NOTE VIEW -->
      <div class="note-view-content today-view animate-fade">
        <div class="note-view-badge">
          <span class="badge-pill today">✨ Latest Note</span>
          <span class="badge-date">Today</span>
        </div>

        <div class="today-body-box">
          <p class="today-text-highlight">
            {{ todayNoteText }}
          </p>
        </div>

        <div class="note-signature-box">
          <p class="sig-from">— Yours,</p>
          <p class="sig-author">Manish 🐉</p>
        </div>

        <!-- Quick Jump to Previous Note -->
        <div class="card-bottom-link-row">
          <button type="button" class="quick-flip-btn" (click)="showPreviousNote()">
            <span>📜 Read Previous Note</span>
            <span class="arrow-icon">→</span>
          </button>
        </div>
      </div>
    }

    @else {
      <!-- PREVIOUS NOTE VIEW -->
      <div class="note-view-content previous-view animate-fade">
        <div class="note-view-badge">
          <span class="badge-pill prev">📜 Previous Note</span>
          <span class="badge-date">Saved Letter</span>
        </div>

        <div class="previous-letter-scroll">
          @for (para of previousNoteParagraphs; track $index) {
            <p class="letter-para">{{ para }}</p>
          }

          <div class="note-signature-box">
            <p class="sig-from">— Yours,</p>
            <p class="sig-author">Manish 🐉</p>
          </div>
        </div>

        <!-- Quick Jump back to Today -->
        <div class="card-bottom-link-row">
          <button type="button" class="quick-flip-btn" (click)="showTodayNote()">
            <span class="arrow-icon">←</span>
            <span>Back to Today's Note</span>
          </button>
        </div>
      </div>
    }

  </div>

  <!-- Bottom Navigation Button -->
  <div class="note-page-footer">
    <button class="continue-btn" (click)="proceedToNextStage()">
      <span>Continue to Questions</span>
      <span class="btn-icon">💬➡️</span>
    </button>
  </div>

</div>
