<div class="note-stack-container">
  
  <!-- Header Title -->
  <div class="stack-header">
    <div class="dragon-accent">🐉</div>
    <h2 class="stack-main-title">Secret Notes Stack</h2>
    <p class="stack-subtitle">tap a card to flip through Manish's notes 💌</p>
  </div>

  <!-- Interactive Stack Cards Area -->
  <div class="card-deck-wrapper" [class.show-previous]="activeCard() === 'previous'">
    
    <!-- CARD 1: TODAY'S NOTE (Front by default) -->
    <div 
      class="stacked-note-card today-card"
      [class.active-front]="activeCard() === 'today'"
      [class.stacked-back]="activeCard() === 'previous'"
      (click)="activeCard() === 'previous' ? showTodayNote() : null"
    >
      <div class="card-header-bar">
        <div class="card-badge-pill today-badge">
          <span class="badge-dot"></span>
          <span>Today's Note 💌</span>
        </div>
        <span class="card-timestamp">Latest</span>
      </div>

      <div class="today-content-body">
        <p class="today-note-text">
          {{ todayNoteText }}
        </p>
        
        <div class="note-author-sig">
          <span>— Manish 🐉</span>
        </div>
      </div>

      <!-- Flip action to view previous note -->
      <div class="card-flip-prompt">
        <button type="button" class="flip-link-btn" (click)="showPreviousNote(); $event.stopPropagation()">
          <span class="flip-icon">📜</span>
          <span>Read Previous Note</span>
          <span class="flip-arrow">→</span>
        </button>
      </div>
    </div>

    <!-- CARD 2: PREVIOUS NOTE (Stacked behind / active when flipped) -->
    <div 
      class="stacked-note-card previous-card"
      [class.active-front]="activeCard() === 'previous'"
      [class.stacked-back]="activeCard() === 'today'"
      (click)="activeCard() === 'today' ? showPreviousNote() : null"
    >
      <div class="card-header-bar">
        <div class="card-badge-pill prev-badge">
          <span class="prev-icon">📜</span>
          <span>Previous Note</span>
        </div>
        <span class="card-timestamp">Saved Letter</span>
      </div>

      <div class="previous-scroll-area">
        @for (para of previousNoteParagraphs; track $index) {
          <p class="prev-para">{{ para }}</p>
        }

        <div class="note-author-sig">
          <p class="sig-line">— Yours,</p>
          <p class="sig-name">Manish 🐉</p>
        </div>
      </div>

      <!-- Flip action to return to today's note -->
      <div class="card-flip-prompt">
        <button type="button" class="flip-link-btn" (click)="showTodayNote(); $event.stopPropagation()">
          <span class="flip-icon">💌</span>
          <span>Back to Today's Note</span>
          <span class="flip-arrow">←</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Next Step Button -->
  <div class="stack-footer-actions">
    <button class="proceed-to-next-btn" (click)="proceedToNextStage()">
      <span>Continue to Questions</span>
      <span class="btn-arrow">💬➡️</span>
    </button>
  </div>

</div>
